spring:
  application:
    name: stocknews
  config:
    # 저장소 최상위 .env 에서 DB 접속 정보를 읽음 (파일이 없으면 건너뜀, 환경변수가 있으면 환경변수 우선)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 기본: 공사 지시서(db/migration) + AI 수집 결과(db/ai-data, 본문 없음, 백엔드1이 PR로 최신화)
    # 예시 기사(db/sample)는 .env 의 FLYWAY_LOCATIONS 로 켬 (그때는 db/ai-data 도 같이 적어야 함)
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/ai-data}
    # 예시 기사를 켰다가 끈 PC에서도 서버가 멈추지 않게 (기록엔 있는데 파일 위치가 빠진 반복 지시서는 무시)
    ignore-migration-patterns: "*:future,repeatable:missing"

# 접속한 사람의 IP (로그인 시도 제한용, 2026-11-16): 화면 요청은 nginx 를 거쳐 오므로 nginx 가 붙인 X-Forwarded-For 를 읽음
# native = Tomcat RemoteIpValve: 보낸 쪽이 internal-proxies 에 맞을 때만 X-Forwarded-For 를 믿음
# internal-proxies (11/19 PR #131 검토): Tomcat 기본값은 10.*·192.168.* 같은 사설망 전부라서, gradlew bootRun 으로 켜면(8080 이 모든 주소에 열림)
#   같은 와이파이의 다른 PC 가 헤더로 IP 를 꾸며 로그인·호출 제한을 피할 수 있었음 → 이 PC(127.*, ::1)와 Docker 네트워크(172.16~31.*, nginx 컨테이너)만 믿음
#   (Docker 가 192.168.* 대역을 주는 PC 면 IP 가 nginx 하나로 보임 → 제한이 모두에게 같이 걸림. docker network inspect 로 확인)
# Docker 로 켤 때는 백엔드 8080 이 이 PC 에서만 열림 (docker-compose.yml 127.0.0.1:8080)
# 응답 압축(gzip): 브라우저가 받을 수 있다고 하면 1KB 넘는 응답을 줄여 보냄 (11/13: 홈 JSON 약 160KB가 압축 없이 오가던 것)
# 실시간 시세(SSE, text/event-stream)는 목록에 넣지 않음 — 압축하면 이벤트가 모였다가 늦게 감
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}'
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1KB

# 헬스체크: /actuator/health 만 웹에 공개 (env·beans 같은 내부 정보는 닫음 — 보안 설정이 나머지 주소를 로그인 없이 열어 두므로 꼭 health 만)
# 결과는 UP/DOWN 만 (DB 연결 상태까지 반영, 자세한 내용은 숨김). Docker healthcheck 가 30초마다 부름 (docker-compose.yml)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis:
  # SQL은 resources/mapper 아래 XML 파일에 작성
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # DB 컬럼 stock_code -> Java 필드 stockCode 자동 연결
    map-underscore-to-camel-case: true

app:
  cors:
    # 우리 API를 부를 수 있는 프론트 주소 (Vite 개발 서버)
    allowed-origins: http://localhost:5173
  jwt:
    # 토큰 서명 키 (.env 의 JWT_SECRET, 32자 이상)
    secret: ${JWT_SECRET}
    # 토큰 유효 시간(분)
    expiration-minutes: 60

# API 문서(Swagger)·demo.html 켜기 (11/19 QA): 개발·시연은 켬(기본). 실제로 내보낼 때는 .env 에 API_DOCS_ENABLED=false
# 꺼지면 /swagger-ui.html·/v3/api-docs 는 404, /demo.html 은 SecurityConfig 가 막음
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    # API 문서 화면 주소: http://localhost:8080/swagger-ui.html
    path: /swagger-ui.html
